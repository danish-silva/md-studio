name: CI

on:
  push:
  pull_request:

# A branch that is also open as a pull request would otherwise build twice; the group
# name matches across both events so the older run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The golden round-trip corpus gates every later phase: if markdown stops
      # surviving the editor, nothing built on top of it is trustworthy.
      - name: Test
        run: npm test

      - name: Build the frontend
        run: npm run build

  rust:
    # Windows, because that is what the app ships on and what the filesystem layer is
    # written against — path handling and the recycle bin behave differently elsewhere.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The golden round-trip corpus gates every later phase: if markdown stops
      # surviving the editor, nothing built on top of it is trustworthy.
      - name: Test
        run: npm test
